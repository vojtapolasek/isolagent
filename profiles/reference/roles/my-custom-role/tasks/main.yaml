# Sample Ansible role: install packages, drop a config file, manage a service.
---
# Install packages using the OS package manager.
- name: Install development tools
  ansible.builtin.dnf:
    name:
      - git
      - jq
      - ripgrep
    state: present

# Create a configuration file from inline content.
- name: Create project configuration
  ansible.builtin.copy:
    dest: /etc/my-project.conf
    content: |
      # Generated by the my-custom-role Ansible role.
      log_level=info
      data_dir=/var/lib/my-project
    owner: root
    group: root
    mode: "0644"

# Enable and start a systemd service.
- name: Enable and start the project service
  ansible.builtin.systemd:
    name: my-project
    enabled: true
    state: started
